name: Validate and Generate Assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'resources/**/*.md'
      - 'scripts/**/*.js'
        - 'docs/resources.schema.json'
        - 'package.json'
        - 'package-lock.json'
      - '.github/workflows/generate-readme.yml'
  pull_request:
    paths:
      - 'resources/**/*.md'
      - 'scripts/**/*.js'
      - 'docs/resources.schema.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/generate-readme.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Validate resources
        run: node scripts/validate-resources.js

      - name: Generate README from resources
        run: node scripts/generate-readme.js

      - name: Generate JSON export from resources
        run: node scripts/generate-json.js

      - name: Validate generated JSON against schema
        run: node scripts/validate-schema.js

      - name: Ensure generated files are up to date on pull requests
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet README.md resources.json; then
            echo "Generated files are up to date."
          else
            echo "::error::Generated files are out of date. Run node scripts/generate-readme.js and node scripts/generate-json.js, then commit changes."
            git diff -- README.md resources.json
            exit 1
          fi

      - name: Commit updated generated files on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(generate): regenerate README and resources JSON'
          file_pattern: README.md resources.json
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
